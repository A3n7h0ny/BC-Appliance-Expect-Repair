# Catch old .html URLs (bookmarks, backlinks, cached Google results)
# and 301 them to the clean canonical URL. Internal links no longer
# use .html, so these only fire for external/legacy requests now.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

