# ── REDIRECTS ────────────────────────────────────────────────
# Old WordPress/hello-world URL
[[redirects]]
  from = "/hello-world/"
  to = "/"
  status = 301
  force = true

# Redirect /fridge-repair-near-me/ to clean service page (no .html)
[[redirects]]
  from = "/fridge-repair-near-me/"
  to = "/fridge-repair"
  status = 301
  force = true

